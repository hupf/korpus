hwalbe), 3 gleiche Schwalben (32.58).</text><text x="20" y="699" font-size="12" fill="#333" font-family="Helvetica">Oberste und unterste Schwalbe hängen an Ober- bzw. Unterkante; mit der Höhe ändern sich nur die mittleren.</text></svg>